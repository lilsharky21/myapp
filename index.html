<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Thesis Journal</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Add to Home Screen: app icon, full-screen, and status bar style -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Thesis">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <!-- TradingView's free chart library (Apache 2.0 license, see vendor/lightweight-charts/LICENSE) -->
  <script src="vendor/lightweight-charts/lightweight-charts.standalone.production.js"></script>
  <!-- "module" lets our JavaScript files import from each other -->
  <script type="module" src="js/app.js"></script>
</head>
<body>

  <!-- ===== The watchlist ===== -->
  <div id="list-view">

  <!-- Thin bar that fades in at the top once you scroll past the big title (like iOS) -->
  <header class="topbar" id="topbar">
    <span class="topbar-title">Watchlist</span>
  </header>

  <main class="page">
    <div class="hero">
      <p class="eyebrow" id="date-line"></p>
      <div class="hero-row">
        <h1 id="big-title">Watchlist</h1>
        <button class="discover-btn" id="discover-btn" type="button">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="m13.2 6.8-2 4.4-4.4 2 2-4.4z"/></svg>Discover
        </button>
        <button class="add-btn" id="add-btn" type="button" aria-label="Add a stock">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <!-- "Add to Home Screen" tip on iPhone (js/install.js) -->
    <div id="install-slot"></div>

    <!-- Look up any stock, on your list or not ( / on a computer) -->
    <div class="search" id="search-box">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
      <input id="search" type="search" placeholder="Search any stock" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Search any stock">
      <ul class="search-results" id="search-results" hidden></ul>
    </div>

    <!-- Markets, sectors, and what needs your attention (js/today.js) -->
    <details class="today" id="today-card">
      <summary><span class="today-title">Today</span><span class="today-updated" id="today-updated"></span></summary>
      <div id="today-body"></div>
    </details>

    <!-- Watching / Own / Closed switch. The "thumb" is the sliding highlight. -->
    <div class="segmented" id="filters" role="tablist" aria-label="Filter ideas">
      <span class="seg-thumb" aria-hidden="true"></span>
      <button type="button" role="tab" data-filter="watching">Watching <span class="count"></span></button>
      <button type="button" role="tab" data-filter="own">Own <span class="count"></span></button>
      <button type="button" role="tab" data-filter="closed">Closed <span class="count"></span></button>
    </div>

    <div class="list-tools">
      <label class="sort-pick"><span>Sort</span>
        <select id="sort">
          <option value="newest">Newest</option>
          <option value="app">App score</option>
          <option value="day">Today's move</option>
          <option value="target">Upside to target</option>
          <option value="conviction">Conviction</option>
          <option value="earnings">Next earnings</option>
          <option value="ticker">A–Z</option>
        </select>
      </label>
      <div class="segmented tiny" id="view-mode" style="--n:2" role="radiogroup" aria-label="Show as">
        <span class="seg-thumb" aria-hidden="true"></span>
        <button type="button" role="radio" data-mode="cards">Cards</button>
        <button type="button" role="radio" data-mode="compare">Compare</button>
      </div>
    </div>

    <!-- Your holdings added up (Own tab) and your track record (Closed tab) -->
    <div id="portfolio"></div>
    <div id="record"></div>

    <!-- The cards get drawn in here by js/app.js -->
    <section class="list" id="list" aria-live="polite"></section>

    <p class="footnote" id="storage-note">Saved on this device.</p>

    <!-- Checks each API key for real (see docs/SETUP.md) -->
    <details class="connections" id="connections">
      <summary>Data connections</summary>
      <div id="conn-body" class="conn-body"></div>
      <div id="batch-box" class="batch-box" hidden></div>
      <div class="backup">
        <p class="conn-name">Backup <span class="muted">· a copy of your whole journal as a file</span></p>
        <div class="btn-row">
          <button type="button" class="text-btn small" id="export-btn">Export</button>
          <button type="button" class="text-btn small" id="import-btn">Import</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
        <p class="muted-line" id="backup-msg"></p>
      </div>
    </details>
    <p class="footnote shortcuts-hint">Shortcuts: <kbd>/</kbd> search · <kbd>N</kbd> new idea · <kbd>D</kbd> discover · <kbd>1</kbd>–<kbd>9</kbd> tabs · <kbd>Esc</kbd> back</p>
  </main>

  </div>

  <!-- ===== Discover: the stock screener (js/screen.js) ===== -->
  <div id="discover-view" class="stock-page discover-page" hidden></div>

  <!-- ===== The stock page (filled in by js/stock.js) ===== -->
  <div id="stock-view" class="stock-page" hidden></div>

  <!-- The add / edit sheet that slides up from the bottom -->
  <div class="backdrop" id="backdrop" hidden></div>
  <form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden novalidate>
    <div class="grabber" aria-hidden="true"></div>
    <header class="sheet-head">
      <button type="button" class="text-btn" id="cancel-btn">Cancel</button>
      <h2 id="sheet-title">New Idea</h2>
      <button type="submit" class="text-btn strong" id="save-btn">Save</button>
    </header>

    <div class="sheet-body">
      <div class="group">
        <label class="row" for="f-ticker">
          <span>Ticker</span>
          <input id="f-ticker" name="ticker" placeholder="AAPL or Apple" maxlength="30"
                 autocomplete="off" autocapitalize="characters" spellcheck="false">
        </label>
        <ul class="search-results in-sheet" id="ticker-results" hidden></ul>
        <label class="row" for="f-company">
          <span>Company</span>
          <input id="f-company" name="company" placeholder="Apple" autocomplete="off">
        </label>
      </div>

      <label class="group-label" for="f-thesis">The thesis</label>
      <div class="group">
        <textarea id="f-thesis" name="thesis" rows="2" placeholder="What has to be true for this to work?"></textarea>
      </div>

      <label class="group-label" for="f-bull">Bull case</label>
      <div class="group">
        <textarea id="f-bull" name="bull" rows="3" placeholder="What goes right, and why the market is missing it"></textarea>
      </div>

      <label class="group-label" for="f-bear">Bear case</label>
      <div class="group">
        <textarea id="f-bear" name="bear" rows="3" placeholder="What would prove you wrong"></textarea>
      </div>

      <p class="group-label">Numbers</p>
      <div class="group">
        <label class="row" for="f-target">
          <span>Target price</span>
          <input id="f-target" name="target" inputmode="decimal" placeholder="$0.00" autocomplete="off">
        </label>
        <label class="row" for="f-entry">
          <span>Price when added</span>
          <input id="f-entry" name="entry" inputmode="decimal" placeholder="$0.00" autocomplete="off">
        </label>
      </div>

      <p class="group-label">Conviction</p>
      <div class="group">
        <div class="row conviction-picker" id="f-conviction" role="radiogroup" aria-label="Conviction">
          <div class="dots-input"></div>
          <span class="conviction-word" id="conviction-word"></span>
        </div>
      </div>

      <p class="group-label">Status</p>
      <div class="segmented small" id="f-status" role="radiogroup" aria-label="Status">
        <span class="seg-thumb" aria-hidden="true"></span>
        <button type="button" role="radio" data-status="watching">Watching</button>
        <button type="button" role="radio" data-status="own">Own</button>
      </div>

      <p class="form-error" id="form-error" hidden></p>

      <button type="button" class="delete-btn" id="delete-btn" hidden>Delete Idea</button>
    </div>
  </form>

</body>
</html>
